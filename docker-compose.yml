version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: hisse-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - rabbitmq

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
        REACT_APP_RECAPTCHA_SITE_KEY: ${REACT_APP_RECAPTCHA_SITE_KEY:-}
        REACT_APP_FINNHUB_API_KEY: ${REACT_APP_FINNHUB_API_KEY:-}
        REACT_APP_TWELVE_DATA_API_KEY: ${REACT_APP_TWELVE_DATA_API_KEY:-}
    container_name: hisse-frontend
    ports:
      - "3000:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf # ✅ SPA config mount

  sms-worker:
    build: ./backend
    container_name: sms-worker
    command: node smsWorker.js
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=docker

  limit-worker:
    build: ./backend
    container_name: limit-worker
    command: node limitWorker.js
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=docker

volumes:
  mongo-data:
